# Lightweight identity/context entities. No financial-state reconstruction is required.
type DataService @entity(immutable: false) {
  id: ID!
  provisions: [Provision!]! @derivedFrom(field: "dataService")
  events: [DataServiceEvent!]! @derivedFrom(field: "dataService")
}

type Provision @entity(immutable: false) {
  "Indexer address followed by verifier/data-service address"
  id: ID!
